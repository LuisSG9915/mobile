name: Release APK

# APK sin EAS (H1.4): el plan gratuito de EAS se agotó, así que el binario lo
# produce `expo prebuild` + Gradle en el runner. El job conserva las garantías
# añadidas en H1.4: preflight antes de gastar minutos, APK verificado por firma
# ZIP, release actualizable y comprobación del activo publicado.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ej: v1.2.0). Obligatorio en dispatch."
        required: true
        type: string
      promote_stable:
        description: "Exigir checklist nativo validado (todos los casos ok) para marcar release estable"
        required: false
        type: boolean
        default: false
      checklist_path:
        description: "Ruta al checklist completado (opcional, ej: docs/testing/releases/v1.0.0.json)"
        required: false
        type: string
      abis:
        description: "ABIs a compilar (por defecto arm64-v8a,armeabi-v7a)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Gradle release APK → GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::workflow_dispatch sin tag"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Preflight de release
        # H1.4: un tag sin nota fechada, con notas sin fechar o con migraciones
        # incompletas no debe llegar a gastar un build.
        run: node scripts/release-check.mjs --tag "${{ steps.tag.outputs.name }}" --allow-existing

      - name: Prebuild Android (CNG)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Inject signing + version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-prepare.mjs --tag "${{ steps.tag.outputs.name }}"

      - name: Build release APK (Gradle)
        id: build
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ADMIN_EMAIL: ${{ vars.EXPO_PUBLIC_ADMIN_EMAIL }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          # El plugin de Sentry exige org y proyecto: sin ellos el build falla al
          # final (tarea *_SentryUpload), no al principio. Sin token no hay subida.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' }}
        run: |
          set -o pipefail
          # Solo ABIs de teléfono: compilar x86/x86_64 para emuladores duplica el
          # tiempo del job y el tamaño del APK. Los emuladores usan dev-client.
          ABIS="${{ inputs.abis }}"
          if [ -z "$ABIS" ]; then ABIS="arm64-v8a,armeabi-v7a"; fi
          if ! ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ABIS" 2>&1 | tee gradle-build.log; then
            echo "::error::Gradle fallo: la release se queda sin binario. Ultimas lineas:"
            tail -n 60 gradle-build.log || true
            exit 1
          fi

      - name: Guardar evidencia del build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-${{ steps.tag.outputs.name }}
          path: apps/mobile/android/gradle-build.log
          if-no-files-found: ignore

      - name: Verificar APK
        id: apk
        run: |
          SRC="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          APK="apps/mobile/photos-${{ steps.tag.outputs.name }}.apk"
          test -s "$SRC" || { echo "::error::no se genero el APK en $SRC"; exit 1; }
          if ! head -c 2 "$SRC" | od -An -tx1 | grep -q "50 4b"; then
            echo "::error::el APK no es un ZIP (firma PK ausente)"
            exit 1
          fi
          cp "$SRC" "$APK"
          echo "APK OK: $(du -h "$APK" | cut -f1)"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Generate & Verify Native Checklist
        id: checklist
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          mkdir -p test-results
          OUT_CHECKLIST="test-results/checklist-${TAG}.json"

          SRC_CHECKLIST="${{ inputs.checklist_path }}"
          if [ -z "$SRC_CHECKLIST" ] && [ -f "apps/mobile/docs/testing/releases/${TAG}.json" ]; then
            SRC_CHECKLIST="apps/mobile/docs/testing/releases/${TAG}.json"
          fi

          if [ -n "$SRC_CHECKLIST" ] && [ -f "$SRC_CHECKLIST" ]; then
            echo "Usando checklist existente desde $SRC_CHECKLIST"
            cp "$SRC_CHECKLIST" "$OUT_CHECKLIST"
          else
            echo "Generando instancia de checklist para $TAG a partir de la plantilla"
            node apps/mobile/scripts/verify-native-checklist.mjs apps/mobile/docs/testing/native-checklist.template.json --generate "$OUT_CHECKLIST" --tag "$TAG"
          fi

          node apps/mobile/scripts/verify-native-checklist.mjs "$OUT_CHECKLIST" --markdown > test-results/checklist-summary.md

          IS_PRERELEASE="true"
          if node apps/mobile/scripts/verify-native-checklist.mjs "$OUT_CHECKLIST" --strict; then
            echo "Checklist 100% verificado."
            IS_PRERELEASE="false"
          else
            echo "Checklist tiene casos pendientes o fallidos."
            if [ "${{ inputs.promote_stable }}" = "true" ]; then
              echo "::error::se solicitó promover a estable pero el checklist no está 100% verificado."
              exit 1
            fi
          fi

          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "checklist_file=${OUT_CHECKLIST}" >> "$GITHUB_OUTPUT"

      - name: Upload Checklist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-checklist-${{ steps.tag.outputs.name }}
          path: ${{ steps.checklist.outputs.checklist_file }}

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          IS_PRE="${{ steps.checklist.outputs.is_prerelease }}"

          PRERELEASE_FLAG=""
          HEADER_NOTE="### Release estable\n\nAPK de Android listo para produccion."
          if [ "$IS_PRE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            HEADER_NOTE="> **Pre-release**: requiere validacion del checklist nativo en dispositivo fisico antes de promoverse a release estable.\n> \n> Descarga \`checklist-${TAG}.json\`, valida los casos y reporta los resultados.\n"
          fi

          NOTES="${HEADER_NOTE}\n\nAPK firmado con Gradle (sin EAS). Instalacion directa o via Obtainium: https://github.com/${{ github.repository }}/releases\n\n$(cat test-results/checklist-summary.md)"

          # Un tag cuyo build fallo no tiene release: re-ejecutar el workflow debe
          # poder crearla, no fallar con "release already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" "${{ steps.checklist.outputs.checklist_file }}" --clobber
            gh release edit "$TAG" --notes "$(echo -e "$NOTES")"
          else
            gh release create "$TAG" \
              --title "Photos ${TAG}" \
              --notes "$(echo -e "$NOTES")" \
              $PRERELEASE_FLAG \
              "${{ steps.apk.outputs.path }}" \
              "${{ steps.checklist.outputs.checklist_file }}"
          fi

      - name: Verificar que la release existe con APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(",")' || true)
          case "$ASSETS" in
            *.apk*) echo "release $TAG publicada con: $ASSETS" ;;
            *) echo "::error::la release $TAG no tiene APK adjunto (assets: ${ASSETS:-ninguno})"; exit 1 ;;
          esac
