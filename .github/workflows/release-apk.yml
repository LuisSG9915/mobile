name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ej: v1.0.0). Vacío = v<appVersion>-b<versionCode>'
        required: false
        type: string
      promote_stable:
        description: 'Exigir checklist nativo validado (todos los casos ok) para marcar release estable'
        required: false
        type: boolean
        default: false
      checklist_path:
        description: 'Ruta al checklist completado (opcional, ej: docs/testing/releases/v1.0.0.json)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: EAS build → GitHub Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Expo/EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build APK on EAS
        id: build
        run: |
          eas build --platform android --profile release-apk --non-interactive --json > eas-build.json
          cat eas-build.json
          echo "apk_url=$(jq -r '.[0].artifacts.applicationArchiveUrl' eas-build.json)" >> "$GITHUB_OUTPUT"
          echo "app_version=$(jq -r '.[0].appVersion' eas-build.json)" >> "$GITHUB_OUTPUT"
          echo "build_version=$(jq -r '.[0].appBuildVersion' eas-build.json)" >> "$GITHUB_OUTPUT"

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${{ steps.build.outputs.app_version }}-b${{ steps.build.outputs.build_version }}" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - name: Download APK
        run: curl -L -o photos-${{ steps.tag.outputs.name }}.apk "${{ steps.build.outputs.apk_url }}"

      - name: Generate & Verify Native Checklist
        id: checklist
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          mkdir -p test-results
          OUT_CHECKLIST="test-results/checklist-${TAG}.json"
          
          # Determinar origen del checklist
          SRC_CHECKLIST="${{ inputs.checklist_path }}"
          if [ -z "$SRC_CHECKLIST" ] && [ -f "docs/testing/releases/${TAG}.json" ]; then
            SRC_CHECKLIST="docs/testing/releases/${TAG}.json"
          fi
          
          if [ -n "$SRC_CHECKLIST" ] && [ -f "$SRC_CHECKLIST" ]; then
            echo "Usando checklist existente desde $SRC_CHECKLIST"
            cp "$SRC_CHECKLIST" "$OUT_CHECKLIST"
          else
            echo "Generando instancia de checklist para $TAG a partir de la plantilla"
            node scripts/verify-native-checklist.mjs docs/testing/native-checklist.template.json --generate "$OUT_CHECKLIST" --tag "$TAG"
          fi
          
          # Generar tabla markdown
          node scripts/verify-native-checklist.mjs "$OUT_CHECKLIST" --markdown > test-results/checklist-summary.md
          
          # Verificar si cumple criterios de release estable
          IS_PRERELEASE="true"
          if node scripts/verify-native-checklist.mjs "$OUT_CHECKLIST" --strict; then
            echo "Checklist 100% verificado."
            IS_PRERELEASE="false"
          else
            echo "Checklist tiene casos pendientes o fallidos."
            if [ "${{ inputs.promote_stable }}" = "true" ]; then
              echo "Error: se solicitó promover a estable pero el checklist no está 100% verificado."
              exit 1
            fi
          fi
          
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "checklist_file=${OUT_CHECKLIST}" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Upload Checklist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-checklist-${{ steps.tag.outputs.name }}
          path: ${{ steps.checklist.outputs.checklist_file }}

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          IS_PRE="${{ steps.checklist.outputs.is_prerelease }}"
          
          PRERELEASE_FLAG=""
          HEADER_NOTE="### 🚀 Release Estable\n\nAPK de Android listo para producción."
          if [ "$IS_PRE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            HEADER_NOTE="> ⚠️ **Pre-release**: Requiere validación del checklist nativo en dispositivo físico antes de promoverse a release estable.\n> \n> Descarga `checklist-${TAG}.json`, valida los casos y reporta los resultados.\n"
          fi
          
          NOTES="${HEADER_NOTE}\n\nBuild EAS ${{ steps.build.outputs.build_version }} (App v${{ steps.build.outputs.app_version }}).\nInstalación directa o vía Obtainium: https://github.com/${{ github.repository }}/releases\n\n$(cat test-results/checklist-summary.md)"
          
          gh release create "${TAG}" \
            --title "Photos ${TAG}" \
            --notes "$(echo -e "$NOTES")" \
            $PRERELEASE_FLAG \
            "apps/mobile/photos-${TAG}.apk" \
            "${{ steps.checklist.outputs.checklist_file }}"
        working-directory: .
