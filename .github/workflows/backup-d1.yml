name: Backup D1

# Respaldo diario del catálogo (usuarios, álbumes, favoritos, shares, metadatos).
# Los originales viven en R2 y los cubre scripts/backup-r2.mjs; esto cubre D1.
#
# Secrets requeridos en el repo:
#   CLOUDFLARE_API_TOKEN  → permisos "D1:Edit" y "Workers R2 Storage:Edit"
#   CLOUDFLARE_ACCOUNT_ID → 461d52ab67ae2435c8dde9a0887f27cb
#
# Restauración: docs/ops/D1_BACKUP.md

on:
  schedule:
    # 03:30 UTC, después del cron de limpieza de las 03:00.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  export:
    name: Export D1 → R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p backups
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          OUT="backups/d1-${STAMP}.sql"
          node node_modules/wrangler/bin/wrangler.js d1 export photos-db \
            --remote --skip-confirmation --output "$OUT"
          # Un export vacío o truncado no debe llegar a R2 como "respaldo".
          test -s "$OUT"
          grep -qi "CREATE TABLE" "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js r2 object put \
            "photos-media/backups/d1/d1-${STAMP}.sql" \
            --file "$OUT" --remote --content-type "application/sql"
          node node_modules/wrangler/bin/wrangler.js r2 object put \
            "photos-media/backups/d1/d1-${STAMP}.sql.sha256" \
            --file "${OUT}.sha256" --remote --content-type "text/plain"

      - name: Summary
        run: |
          {
            echo "### Respaldo D1 completado"
            echo ""
            echo "- Archivo: \`d1-${STAMP}.sql\`"
            echo "- Destino: \`r2://photos-media/backups/d1/\`"
            echo "- Tamaño: $(du -h "$OUT" | cut -f1)"
            echo ""
            echo "Restauración: \`docs/ops/D1_BACKUP.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
